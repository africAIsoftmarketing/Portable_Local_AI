<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfricAIsoft Portable Studio</title>
    <meta http-equiv="refresh" content="0; url=/api/" />
    <style>
        body {
            font-family: "Iowan Old Style", "Palatino", "Georgia", serif;
            background: #f6f2ea; color: #23241f;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        .card {
            text-align: center; padding: 40px 60px;
            background: #fff; border-radius: 10px;
            border: 1px solid #d9d3c4;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
        }
        .logo {
            width: 48px; height: 48px; margin: 0 auto 16px;
            display: grid; place-items: center;
            background: #2f5c3a; color: #fff;
            border-radius: 10px; font-weight: 700; font-size: 22px;
        }
        h1 { margin: 0 0 8px; font-size: 22px; }
        p  { margin: 8px 0; color: #5c5b52; }
        a  { color: #2f5c3a; }
        .lang-switch { margin-top: 20px; font-size: 12px; color: #5c5b52; font-family: monospace; }
    </style>
</head>
<body>
<main class="card">
    <div class="logo">A</div>
    <h1 lang="fr">AfricAIsoft Portable Studio</h1>
    <p lang="fr">Redirection vers l'interface&hellip;</p>
    <p lang="en">Redirecting to the interface&hellip;</p>
    <p><a href="/api/">/api/</a></p>
    <div class="lang-switch">FR · EN</div>
</main>
<script>
    // Fallback si meta-refresh désactivé.
    setTimeout(function () { window.location.replace("/api/"); }, 200);
</script>
</body>
</html>
