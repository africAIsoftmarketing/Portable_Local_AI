# ──────────────────────────────────────────────────────────────────────────────
# Rôle    : compilation matricielle de llama-server (llama.cpp) sur GitHub
#           Actions puis assemblage de la « master copy » AfricAIsoft
#           Portable Studio, RESTREINTE aux cibles dont le build passe au vert.
#
#           Cibles conservées (succès CI) :
#             - Windows CPU (AVX2)
#             - macOS ARM64 Metal
#             - macOS ARM64 CPU
#             - Linux ARM64 CPU (NEON, cross-compile)
#
#           Cibles RETIRÉES (échec ou non validées à ce jour) :
#             - Windows CUDA / Windows Vulkan
#             - macOS Intel Metal / macOS Intel CPU (non validées : en attente)
#             - Linux x86_64 CPU / CUDA / Vulkan
#           Elles pourront être réintégrées une fois leurs échecs corrigés.
#
# Notes    :
#   - Le nommage des dossiers de destination suit STRICTEMENT le brief client :
#     `bin/windows/<backend>`, `bin/darwin-arm64/<backend>`,
#     `bin/linux-aarch64/<backend>`. ⚠ Les launchers existants résolvent le
#     chemin `bin/${os}-${arch}/${backend}` avec `${os}` = uname -s minuscule
#     (`linux`, `darwin`) et `${arch}` = `x86_64` / `aarch64` / `arm64`.
#   - Wheels Python Linux ARM64 résolues en `manylinux_2_17_aarch64`
#     (glibc ≥ 2.17). ⚠ Passer UN tag par --platform : la forme fusionnée
#     `manylinux_2_17_aarch64.manylinux2014_aarch64` (nom de fichier wheel)
#     n'est reconnue par pip comme aucun tag → « from versions: none ».
#   - Structure garantie : chaque archive est contrôlée AVANT compression
#     contre les règles du Key Builder (MasterCopyValidator) — dossiers
#     obligatoires, lanceur, plateformes et backends verrouillés,
#     llama-server présent, python/wheels/ non vide, CHECKSUMS.sha256.
#     Tout écart fait échouer le job : aucune archive non conforme publiée.
#   - GITHUB_TOKEN automatique uniquement ; aucun secret custom requis.
# Auteur  : AfricAIsoft — Licence : MIT
# ──────────────────────────────────────────────────────────────────────────────
name: build-master-copy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à empaqueter (défaut = contenu du fichier VERSION)."
        required: false
        default: ""

permissions:
  contents: read

env:
  LLAMA_CPP_REPO: "ggml-org/llama.cpp"
  PBS_TAG: "20240814"
  PYTHON_VERSION: "3.12.5"

jobs:
  resolve:
    name: Résolution tag llama.cpp
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout (lecture VERSION)
        uses: actions/checkout@v4
      - id: ver
        name: Résolution version paquet
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.ref_name }}" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Version paquet : ${V}"
      - id: pick
        name: Résolution dernier tag stable llama.cpp (bXXXX ≥ b5000)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh api --paginate --slurp "repos/${LLAMA_CPP_REPO}/releases?per_page=100" | jq -r '[.[][] | select(.prerelease == false and .draft == false) | select(.tag_name | test("^b[0-9]{4,}$")) | select((.tag_name[1:] | tonumber) >= 5000) | {tag: .tag_name, number: (.tag_name[1:] | tonumber)}] | if length == 0 then empty else max_by(.number).tag end')"
          if [ -z "${TAG}" ]; then
            echo "::error::Aucun tag stable b5000+ trouvé pour ${LLAMA_CPP_REPO}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "llama.cpp tag retenu : ${TAG}"

  build-win-cpu:
    name: Windows CPU (AVX2)
    needs: resolve
    runs-on: windows-2022
    env:
      OUT_DIR: bin/windows/cpu
    steps:
      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp
      - name: Configure & build (CPU AVX2)
        shell: pwsh
        working-directory: llama.cpp
        run: |
          cmake -B build -S . `
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_AVX=ON `
            -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel
      - name: Collecte binaires + DLLs
        shell: pwsh
        run: |
          $out = "${{ env.OUT_DIR }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item llama.cpp/build/bin/Release/llama-server.exe $out
          Get-ChildItem llama.cpp/build/bin/Release/*.dll | Copy-Item -Destination $out
      - uses: actions/upload-artifact@v4
        with:
          name: llama-windows-cpu
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  build-darwin-arm64-metal:
    name: macOS ARM64 Metal
    needs: resolve
    runs-on: macos-14
    env:
      OUT_DIR: bin/darwin-arm64/metal
    steps:
      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp
      - name: Configure & build (Metal)
        working-directory: llama.cpp
        run: |
          cmake -B build -S . \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel
      - name: Collecte binaires + dylibs
        run: |
          mkdir -p "${OUT_DIR}"
          cp llama.cpp/build/bin/llama-server "${OUT_DIR}/"
          cp llama.cpp/build/bin/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/ggml/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: llama-darwin-arm64-metal
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  build-darwin-arm64-cpu:
    name: macOS ARM64 CPU
    needs: resolve
    runs-on: macos-14
    env:
      OUT_DIR: bin/darwin-arm64/cpu
    steps:
      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp
      - name: Configure & build (CPU NEON)
        working-directory: llama.cpp
        run: |
          cmake -B build -S . \
            -DGGML_METAL=OFF -DGGML_ACCELERATE=OFF -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel
      - name: Collecte binaires + dylibs
        run: |
          mkdir -p "${OUT_DIR}"
          cp llama.cpp/build/bin/llama-server "${OUT_DIR}/"
          cp llama.cpp/build/bin/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/ggml/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: llama-darwin-arm64-cpu
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  build-linux-aarch64-cpu:
    name: Linux ARM64 CPU (NEON, cross-compile)
    needs: resolve
    runs-on: ubuntu-22.04
    env:
      OUT_DIR: bin/linux-aarch64/cpu
    steps:
      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp
      - name: Configure & build (aarch64 cross)
        working-directory: llama.cpp
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          cmake -B build -S . \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel 2
      - name: Collecte binaires + libs
        run: |
          mkdir -p "${OUT_DIR}"
          cp llama.cpp/build/bin/llama-server "${OUT_DIR}/"
          cp -a llama.cpp/build/bin/*.so* "${OUT_DIR}/" 2>/dev/null || true
          cp -a llama.cpp/build/src/*.so* "${OUT_DIR}/" 2>/dev/null || true
          cp -a llama.cpp/build/ggml/src/*.so* "${OUT_DIR}/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: llama-linux-aarch64-cpu
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Wheels Python Windows — résolues NATIVEMENT sur Windows : pip évalue les
  # marqueurs (sys_platform…) contre la machine qui l'exécute, pas contre
  # --platform. Depuis Linux, il réclamerait uvloop (absent sous Windows) et
  # oublierait colorama (requis sous Windows).
  # ───────────────────────────────────────────────────────────────────────────
  wheels-windows:
    name: Wheels Python Windows (natif)
    runs-on: windows-2022
    steps:
      - name: Checkout du dépôt (requirements)
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharge les wheels win_amd64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Mise à jour de pip échouée" }
          python -m pip download `
            --dest wheels-windows `
            --only-binary=:all: `
            --index-url https://pypi.org/simple `
            -r app/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip download (Windows) a échoué" }
          Get-ChildItem wheels-windows | Select-Object Name

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheels-windows
          if-no-files-found: error
          retention-days: 7

  package-release:
    name: Assemblage + release GitHub
    needs:
      - resolve
      - build-win-cpu
      - build-darwin-arm64-metal
      - build-darwin-arm64-cpu
      - build-linux-aarch64-cpu
      - wheels-windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout du dépôt (tag/ref déclencheur)
        uses: actions/checkout@v4
      - name: Prépare l'arborescence portable AfricAIsoft-Portable-v${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          PKG="AfricAIsoft-Portable-v${VERSION}"
          # Dossiers obligatoires et lanceur exigés par le Key Builder
          # (MasterCopyLayout.RequiredRootDirectories / LauncherCandidates).
          missing=""
          for d in config mcp-servers ui scripts; do
            [ -d "${d}" ] || missing="${missing} ${d}/"
          done
          if [ -n "${missing}" ]; then
            echo "::error::Dossiers obligatoires absents du dépôt :${missing}"
            exit 1
          fi
          if [ ! -e start-windows.bat ] && [ ! -e start-linux.sh ] && [ ! -e start-mac.command ]; then
            echo "::error::Aucun lanceur (start-windows.bat / start-linux.sh / start-mac.command)."
            exit 1
          fi
          mkdir -p "${PKG}"
          for item in app config mcp-servers skills scripts ui tests docs start-linux.sh start-mac.command start-windows.bat stop-linux.sh stop-mac.sh install.sh install.bat start.sh start.bat README.md CHANGELOG.md LICENSE VERSION release.json release.json.sig; do
            if [ -e "${item}" ]; then cp -a "${item}" "${PKG}/"; fi
          done
          mkdir -p "${PKG}/data/pids" "${PKG}/logs" "${PKG}/models"
          [ -f data/pids/.gitkeep ] && cp data/pids/.gitkeep "${PKG}/data/pids/" || :
          touch "${PKG}/logs/.gitkeep" "${PKG}/models/.gitkeep"
          rm -f "${PKG}/config/settings.json" "${PKG}/config/api_key.txt"
          if [ ! -f "${PKG}/config/settings.example.json" ]; then
            echo "::error::config/settings.example.json manquant dans le paquet."
            exit 1
          fi
          echo "PKG=${PKG}" >> "$GITHUB_ENV"
      - name: Télécharge tous les artifacts binaires (bin/)
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Range les binaires aux bons chemins bin/<plat>/<backend>/
        shell: bash
        run: |
          set -euo pipefail
          declare -A MAP=([llama-windows-cpu]="${PKG}/bin/windows/cpu" [llama-darwin-arm64-metal]="${PKG}/bin/darwin-arm64/metal" [llama-darwin-arm64-cpu]="${PKG}/bin/darwin-arm64/cpu" [llama-linux-aarch64-cpu]="${PKG}/bin/linux-aarch64/cpu")
          for name in "${!MAP[@]}"; do
            src="artifacts/${name}"; dst="${MAP[$name]}"
            if [ ! -d "${src}" ] || [ -z "$(ls -A "${src}")" ]; then
              echo "::error::Artifact ${name} manquant ou vide (backend vide interdit)."
              exit 1
            fi
            mkdir -p "${dst}"; cp -a "${src}/." "${dst}/"
          done
          find "${PKG}/bin/linux-aarch64" "${PKG}/bin/darwin-arm64" -type f ! -name "*.so*" ! -name "*.dylib" -exec chmod +x {} + 2>/dev/null || true
          find "${PKG}" -maxdepth 2 -type f \( -name "*.sh" -o -name "*.command" \) -exec chmod +x {} +
      - name: Télécharge Python 3.12 embarqué + wheels par plateforme
        shell: bash
        env:
          PBS_URL_BASE: "https://github.com/astral-sh/python-build-standalone/releases/download/${{ env.PBS_TAG }}"
          WIN_EMBED_URL: "https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/python-${{ env.PYTHON_VERSION }}-embed-amd64.zip"
        run: |
          set -euo pipefail
          mkdir -p /tmp/py
          curl -fSL "${WIN_EMBED_URL}" -o /tmp/py/win.zip
          mkdir -p "${PKG}/bin/windows/python"
          unzip -q /tmp/py/win.zip -d "${PKG}/bin/windows/python"
          declare -A PBS=([linux-aarch64]="cpython-${PYTHON_VERSION}+${PBS_TAG}-aarch64-unknown-linux-gnu-install_only.tar.gz" [darwin-arm64]="cpython-${PYTHON_VERSION}+${PBS_TAG}-aarch64-apple-darwin-install_only.tar.gz")
          for plat in "${!PBS[@]}"; do
            asset="${PBS[$plat]}"; url="${PBS_URL_BASE}/${asset}"
            curl -fSL "${url}" -o "/tmp/py/${plat}.tar.gz"
            curl -fSL "${url}.sha256" -o "/tmp/py/${plat}.sha256" || { echo "::error::Empreinte SHA-256 upstream indisponible pour ${asset}."; exit 1; }
            expected="$(awk '{print $1}' "/tmp/py/${plat}.sha256")"; actual="$(sha256sum "/tmp/py/${plat}.tar.gz" | awk '{print $1}')"
            if [ "${expected}" != "${actual}" ]; then echo "::error::SHA-256 mismatch pour ${asset}. attendu=${expected} obtenu=${actual}"; exit 1; fi
            mkdir -p "${PKG}/bin/${plat}/python"
            tar -C "${PKG}/bin/${plat}/python" --strip-components=1 -xzf "/tmp/py/${plat}.tar.gz"
          done
      - name: Setup Python 3.12 (résolution wheels)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pré-installe les wheels Python par plateforme
        # Résolution cross-platform avec le python3 du runner (jamais les
        # interpréteurs embarqués ARM64/darwin : Exec format error).
        # Un seul tag par --platform. Windows est résolu nativement (job
        # wheels-windows) car pip évalue les marqueurs contre le runner.
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip

          download_wheels() {
              local plat="$1"
              local pip_platform="$2"
              local wheels_dir="${PKG}/bin/${plat}/python/wheels"

              mkdir -p "${wheels_dir}"

              python3 -m pip download \
                --dest "${wheels_dir}" \
                --platform "${pip_platform}" \
                --python-version 3.12 \
                --implementation cp \
                --only-binary=:all: \
                --index-url https://pypi.org/simple \
                -r app/requirements.txt
          }

          # Linux ARM64 : glibc >= 2.17 (tag unique, PAS la forme fusionnée).
          download_wheels "linux-aarch64" "manylinux_2_17_aarch64"
          # macOS Apple Silicon : pip accepte aussi les wheels universal2.
          download_wheels "darwin-arm64"  "macosx_11_0_arm64"
          # Windows x64 : wheels résolues nativement par le job wheels-windows
          # (téléchargées dans artifacts/ par l'étape download-artifact).
          if [ ! -d artifacts/wheels-windows ] || [ -z "$(ls -A artifacts/wheels-windows)" ]; then
              echo "::error::Artifact wheels-windows manquant ou vide."
              exit 1
          fi
          mkdir -p "${PKG}/bin/windows/python/wheels"
          cp -a artifacts/wheels-windows/. "${PKG}/bin/windows/python/wheels/"
      - name: Contrôle de conformité + construit les archives (.zip)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          BASE="AfricAIsoft-Portable-v${VERSION}"
          # Réplique des règles de MasterCopyValidator.cs (Key Builder).
          check_layout() {
            local root="$1" label="$2" errs=0 nplat=0
            declare -A VALID=(
              [windows]="cpu cuda vulkan"
              [darwin-arm64]="cpu metal"
              [darwin-x86_64]="cpu metal"
              [linux-x86_64]="cpu cuda vulkan rocm"
              [linux-aarch64]="cpu"
            )
            for d in config mcp-servers bin ui scripts; do
              [ -d "${root}/${d}" ] || { echo "::error::[${label}] Dossier obligatoire absent : ${d}/"; errs=$((errs+1)); }
            done
            if [ ! -e "${root}/start-windows.bat" ] && [ ! -e "${root}/start-linux.sh" ] && [ ! -e "${root}/start-mac.command" ]; then
              echo "::error::[${label}] Aucun lanceur à la racine."; errs=$((errs+1))
            fi
            for platdir in "${root}"/bin/*/; do
              local plat; plat="$(basename "${platdir}")"
              if [ -z "${VALID[$plat]+x}" ]; then
                echo "::error::[${label}] Plateforme inconnue sous bin/ : ${plat}"; errs=$((errs+1)); continue
              fi
              nplat=$((nplat+1))
              for bdir in "${platdir}"*/; do
                local b; b="$(basename "${bdir}")"
                [ "${b}" = "python" ] && continue
                case " ${VALID[$plat]} " in
                  *" ${b} "*) ;;
                  *) echo "::error::[${label}] Backend invalide : ${plat}/${b}"; errs=$((errs+1)); continue ;;
                esac
                local srv=( "${bdir}"llama-server* )
                [ ${#srv[@]} -gt 0 ] || { echo "::error::[${label}] llama-server absent : ${plat}/${b}"; errs=$((errs+1)); }
              done
              local whl=( "${platdir}"python/wheels/*.whl )
              [ ${#whl[@]} -gt 0 ] || { echo "::error::[${label}] Aucune wheel : ${plat}/python/wheels/"; errs=$((errs+1)); }
            done
            [ ${nplat} -gt 0 ] || { echo "::error::[${label}] Aucune plateforme sous bin/."; errs=$((errs+1)); }
            [ ${errs} -eq 0 ] && echo "✓ [${label}] conforme (${nplat} plateforme(s))"
            return ${errs}
          }
          make_zip() {
            local name="$1"; shift; local -a includes=("$@"); local staging="staging-${name}"
            rm -rf "${staging}"; mkdir -p "${staging}/${BASE}"
            cp -a "${PKG}"/*.md "${PKG}/LICENSE" "${PKG}/VERSION" "${staging}/${BASE}/" 2>/dev/null || true
            for item in app config mcp-servers skills scripts ui tests docs data logs models start-linux.sh start-mac.command start-windows.bat stop-linux.sh stop-mac.sh install.sh install.bat start.sh start.bat release.json release.json.sig; do
              if [ -e "${PKG}/${item}" ]; then cp -a "${PKG}/${item}" "${staging}/${BASE}/"; fi
            done
            mkdir -p "${staging}/${BASE}/bin"
            for inc in "${includes[@]}"; do
              if [ ! -d "${PKG}/bin/${inc}" ]; then echo "::error::[${name}] bin/${inc} absent du paquet."; return 1; fi
              cp -a "${PKG}/bin/${inc}" "${staging}/${BASE}/bin/"
            done
            check_layout "${staging}/${BASE}" "${name}"
            ( cd "${staging}/${BASE}" && find . -type f ! -name "CHECKSUMS.sha256" -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > CHECKSUMS.sha256 )
            ( cd "${staging}" && zip -qr "../dist/${BASE}-${name}.zip" "${BASE}" )
            rm -rf "${staging}"
            local sz; sz=$(du -m "dist/${BASE}-${name}.zip" | awk '{print $1}'); echo "→ ${BASE}-${name}.zip : ${sz} Mo"
            if [ "${name}" = "all" ] && [ "${sz}" -gt 1200 ]; then echo "::warning::${BASE}-${name}.zip = ${sz} Mo > 1200 Mo (cible)."; elif [ "${name}" != "all" ] && [ "${sz}" -gt 500 ]; then echo "::warning::${BASE}-${name}.zip = ${sz} Mo > 500 Mo (cible)."; fi
          }
          make_zip "windows" windows; make_zip "darwin" darwin-arm64; make_zip "linux" linux-aarch64; make_zip "all" windows darwin-arm64 linux-aarch64
          ls -la dist/
      - name: Extrait la section CHANGELOG de la version en cours
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/release-notes.md
          import re, os
          v = os.environ["VERSION"]; txt = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^##\s*\[{re.escape(v)}\][^\n]*\n(.*?)(?=^##\s*\[|\Z)", txt, flags=re.M | re.S)
          print(m.group(0).rstrip() if m else f"# AfricAIsoft Portable Studio v{v}\n\nSection CHANGELOG.md correspondante introuvable ; voir le fichier CHANGELOG.md dans l'archive.")
          PY
          head -20 /tmp/release-notes.md
      - name: Crée la release GitHub + upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AfricAIsoft Portable Studio v${{ env.VERSION }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/AfricAIsoft-Portable-v${{ env.VERSION }}-windows.zip
            dist/AfricAIsoft-Portable-v${{ env.VERSION }}-darwin.zip
            dist/AfricAIsoft-Portable-v${{ env.VERSION }}-linux.zip
            dist/AfricAIsoft-Portable-v${{ env.VERSION }}-all.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
