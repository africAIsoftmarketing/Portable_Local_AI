# ─────────────────────────────────────────────────────────────────────────────
# Rôle    : compilation matricielle de llama-server (llama.cpp) sur GitHub
#           Actions puis assemblage de la « master copy » AfricAIsoft
#           Portable Studio en 4 archives téléchargeables attachées à la
#           release GitHub. Ajout PUR : le workflow ne modifie AUCUN fichier
#           du dépôt. Le tag `v*` (ou le workflow_dispatch) déclenche tout.
#
# Notes    :
#   - Nommage VERROUILLÉ (aligné sur keybuilder/…/MasterCopyLayout.cs) :
#     `bin/windows/`, `bin/darwin-arm64/`, `bin/darwin-x86_64/`,
#     `bin/linux-x86_64/`, `bin/linux-aarch64/`. Chaque archive est contrôlée
#     contre ces règles AVANT compression (étape « Contrôle de conformité »).
#   - Plancher glibc Linux : 2.35 (binaires compilés sur ubuntu-22.04, y compris
#     la chaîne croisée aarch64). Les wheels Python visent manylinux_2_17.
#   - Windows : Python embeddable SANS pip → les dépendances sont PRÉ-INSTALLÉES
#     au build (job python-windows, résolution native) dans
#     bin/windows/python/Lib/site-packages, et `import site` est activé dans
#     le fichier ._pth. Les wheels restent livrées dans python/wheels/.
#   - CUDA : le runtime (cudart, cublas, cublasLt) est livré à côté de
#     llama-server ; seul le pilote NVIDIA est requis sur le poste cible.
#   - Backend ROCm exclu (aucun runner GitHub-hosted avec toolkit). Voir
#     `scripts/build-llama-server.sh rocm` pour la procédure locale.
#   - llama-server compilé SANS OpenSSL (-DLLAMA_OPENSSL=OFF) : l'option est
#     active par défaut depuis le passage de llama.cpp à cpp-httplib, et le
#     runner Windows fournit OpenSSL → llama-server.exe exigeait
#     libssl-3-x64.dll, absente des postes clients. HTTPS ne sert qu'au
#     téléchargement de modèles (-hf) : inutile sur une clé hors ligne.
#     Garde-fou : la release échoue si un binaire référence encore OpenSSL.
#   - GITHUB_TOKEN automatique uniquement ; aucun secret custom requis.
# Auteur  : AfricAIsoft — Licence : MIT
# ─────────────────────────────────────────────────────────────────────────────
name: build-master-copy-full

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à empaqueter (défaut = contenu du fichier VERSION)."
        required: false
        default: ""

# Politique de permissions : lecture par défaut, écriture uniquement sur le
# job final `package-release` (création de release + upload d'assets).
permissions:
  contents: read

env:
  LLAMA_CPP_REPO: "ggml-org/llama.cpp"
  # Version épinglée de python-build-standalone (astral-sh) — évite tout
  # « latest » volatile. À bumper explicitement quand nécessaire.
  PBS_TAG: "20240814"
  # Version du Python embarqué (Windows embeddable + python-build-standalone).
  PYTHON_VERSION: "3.12.5"
  # Version du SDK Vulkan Windows (installeur officiel LunarG).
  VULKAN_SDK_VERSION: "1.3.283.0"

# ─────────────────────────────────────────────────────────────────────────────
# Job utilitaire : résolution du tag llama.cpp stable le plus récent (bXXXX).
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  resolve:
    name: Résolution tag llama.cpp
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout (lecture VERSION)
        uses: actions/checkout@v4

      - id: ver
        name: Résolution version paquet
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.ref_name }}" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Version paquet : ${V}"

      - id: pick
        name: Résolution dernier tag stable llama.cpp (bXXXX ≥ b5000)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(
            gh api --paginate --slurp \
              "repos/${LLAMA_CPP_REPO}/releases?per_page=100" |
            jq -r '
              [
                .[][] |
                select(.prerelease == false and .draft == false) |
                select(.tag_name | test("^b[0-9]{4,}$")) |
                select((.tag_name[1:] | tonumber) >= 5000) |
                { tag: .tag_name, number: (.tag_name[1:] | tonumber) }
              ]
              | if length == 0 then empty else max_by(.number).tag end
            '
          )"
          if [ -z "${TAG}" ]; then
            echo "::error::Aucun tag stable b5000+ trouvé pour ${LLAMA_CPP_REPO}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "llama.cpp tag retenu : ${TAG}"

  # ───────────────────────────────────────────────────────────────────────────
  # Compilation Windows (runner épinglé : windows-latest peut perdre VS 2022)
  # Chaque backend embarque le runtime VC++ en déploiement local
  # (vcruntime140, vcruntime140_1, msvcp140), autorisé par Microsoft.
  # ───────────────────────────────────────────────────────────────────────────
  build-win-cpu:
    name: Windows CPU (AVX2)
    needs: resolve
    runs-on: windows-2022
    env:
      OUT_DIR: bin/windows/cpu
    steps:
      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp

      - name: Configure & build (CPU AVX2)
        shell: pwsh
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = "Stop"
          cmake -B build -S . `
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_AVX=ON `
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "cmake configure a échoué" }
          cmake --build build --config Release --target llama-server --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build a échoué" }

      - name: Collecte binaires + DLLs + runtime VC++
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "${{ env.OUT_DIR }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item llama.cpp/build/bin/Release/llama-server.exe $out
          Get-ChildItem llama.cpp/build/bin/Release/*.dll | Copy-Item -Destination $out
          foreach ($n in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            $src = Join-Path $env:SystemRoot "System32\$n"
            if (Test-Path $src) { Copy-Item $src $out } else { Write-Warning "Runtime VC++ absent du runner : $n" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: llama-windows-cpu
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  build-win-cuda:
    name: Windows CUDA
    needs: resolve
    runs-on: windows-2022
    env:
      OUT_DIR: bin/windows/cuda
    steps:
      - name: Install CUDA Toolkit 12.4
        uses: Jimver/cuda-toolkit@v0.2.18
        with:
          cuda: "12.4.1"
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","curand","curand_dev"]'
          method: "network"

      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp

      - name: Verify Visual Studio and CUDA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe introuvable : Visual Studio absent" }
          & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0) { throw "Aucune installation Visual Studio avec MSVC" }
          if (-not $env:CUDA_PATH) { throw "CUDA_PATH non défini" }
          $nvcc = Join-Path $env:CUDA_PATH "bin\nvcc.exe"
          if (-not (Test-Path $nvcc)) { throw "nvcc introuvable : $nvcc" }
          & $nvcc --version

      - name: Configure & build (CUDA)
        shell: pwsh
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = "Stop"
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH\bin\nvcc.exe" `
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "cmake configure a échoué" }
          cmake --build build --config Release --target llama-server --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build a échoué" }

      - name: Collecte binaires + DLLs + runtimes CUDA et VC++
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "${{ env.OUT_DIR }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item llama.cpp/build/bin/Release/llama-server.exe $out
          Get-ChildItem llama.cpp/build/bin/Release/*.dll | Copy-Item -Destination $out
          # Runtime CUDA : sans lui, llama-server échoue sur un poste qui n'a
          # que le pilote NVIDIA (cas normal d'un utilisateur final).
          foreach ($n in "cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll") {
            $src = Join-Path $env:CUDA_PATH "bin\$n"
            if (-not (Test-Path $src)) { throw "Runtime CUDA introuvable : $src" }
            Copy-Item $src $out
          }
          foreach ($n in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            $src = Join-Path $env:SystemRoot "System32\$n"
            if (Test-Path $src) { Copy-Item $src $out } else { Write-Warning "Runtime VC++ absent du runner : $n" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: llama-windows-cuda
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  build-win-vulkan:
    name: Windows Vulkan
    needs: resolve
    runs-on: windows-2022
    env:
      OUT_DIR: bin/windows/vulkan
    steps:
      # Installeur officiel LunarG : remplace humbletim/setup-vulkan-sdk@v1.2.0,
      # bloqué par GitHub (dépendance interne actions/cache@v2).
      - name: Install Vulkan SDK (LunarG)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = "${{ env.VULKAN_SDK_VERSION }}"
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-Installer.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$v/windows/VulkanSDK-$v-Installer.exe" -OutFile $installer
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
            "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if ($p.ExitCode -ne 0) { throw "Installeur Vulkan SDK en échec (code $($p.ExitCode))" }
          $sdk = "C:\VulkanSDK\$v"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "glslc.exe absent de $sdk\Bin" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdk"
          Add-Content $env:GITHUB_PATH "$sdk\Bin"
          & "$sdk\Bin\glslc.exe" --version

      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp

      - name: Configure & build (Vulkan)
        shell: pwsh
        working-directory: llama.cpp
        run: |
          $ErrorActionPreference = "Stop"
          cmake -B build -S . `
            -DGGML_VULKAN=ON `
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "cmake configure a échoué" }
          cmake --build build --config Release --target llama-server --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build a échoué" }

      - name: Collecte binaires + DLLs + runtime VC++
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "${{ env.OUT_DIR }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item llama.cpp/build/bin/Release/llama-server.exe $out
          Get-ChildItem llama.cpp/build/bin/Release/*.dll | Copy-Item -Destination $out
          foreach ($n in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            $src = Join-Path $env:SystemRoot "System32\$n"
            if (Test-Path $src) { Copy-Item $src $out } else { Write-Warning "Runtime VC++ absent du runner : $n" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: llama-windows-vulkan
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Python Windows — résolu NATIVEMENT : pip évalue les marqueurs
  # (sys_platform…) contre la machine qui l'exécute, pas contre --platform.
  # Produit : wheels/ (livrées) + site-packages/ (pré-installé, car le
  # Python embeddable n'a pas de pip pour installer au premier lancement).
  # ───────────────────────────────────────────────────────────────────────────
  python-windows:
    name: Python Windows (wheels + site-packages)
    runs-on: windows-2022
    steps:
      - name: Checkout du dépôt (requirements)
        uses: actions/checkout@v4

      - name: Setup Python 3.12 (même mineure que l'embeddable)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharge les wheels puis pré-installe site-packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Mise à jour de pip échouée" }
          python -m pip download --dest pywin/wheels --only-binary=:all: `
            --index-url https://pypi.org/simple -r app/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip download (Windows) a échoué" }
          # Installation hors ligne depuis ces mêmes wheels : contenu identique.
          python -m pip install --no-index --find-links pywin/wheels `
            --only-binary=:all: --target pywin/site-packages -r app/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install --target a échoué" }
          "{0} wheels, site-packages prêt" -f (Get-ChildItem pywin/wheels).Count

      - uses: actions/upload-artifact@v4
        with:
          name: python-windows
          path: pywin
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Compilation macOS (Apple Silicon + Intel)
  # ───────────────────────────────────────────────────────────────────────────
  build-darwin-arm64-metal:
    name: macOS ARM64 Metal
    needs: resolve
    runs-on: macos-14
    env:
      OUT_DIR: bin/darwin-arm64/metal
    steps:
      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp

      - name: Configure & build (Metal)
        working-directory: llama.cpp
        run: |
          cmake -B build -S . \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel

      - name: Collecte binaires + dylibs
        run: |
          mkdir -p "${OUT_DIR}"
          cp llama.cpp/build/bin/llama-server "${OUT_DIR}/"
          cp llama.cpp/build/bin/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/ggml/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: llama-darwin-arm64-metal
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  build-darwin-arm64-cpu:
    name: macOS ARM64 CPU
    needs: resolve
    runs-on: macos-14
    env:
      OUT_DIR: bin/darwin-arm64/cpu
    steps:
      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp

      - name: Configure & build (CPU NEON)
        working-directory: llama.cpp
        run: |
          cmake -B build -S . \
            -DGGML_METAL=OFF -DGGML_ACCELERATE=OFF -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel

      - name: Collecte binaires + dylibs
        run: |
          mkdir -p "${OUT_DIR}"
          cp llama.cpp/build/bin/llama-server "${OUT_DIR}/"
          cp llama.cpp/build/bin/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/ggml/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: llama-darwin-arm64-cpu
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  # Runner Intel : l'image macos-13 a été retirée par GitHub (d'où les jobs
  # restés « en attente »). macos-15-intel est l'image Intel qui la remplace.
  build-darwin-x86_64-metal:
    name: macOS Intel Metal
    needs: resolve
    runs-on: macos-15-intel
    env:
      OUT_DIR: bin/darwin-x86_64/metal
    steps:
      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp

      - name: Configure & build (Metal x86_64)
        working-directory: llama.cpp
        run: |
          cmake -B build -S . \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel

      - name: Collecte binaires + dylibs
        run: |
          mkdir -p "${OUT_DIR}"
          cp llama.cpp/build/bin/llama-server "${OUT_DIR}/"
          cp llama.cpp/build/bin/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/ggml/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: llama-darwin-x86_64-metal
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  build-darwin-x86_64-cpu:
    name: macOS Intel CPU (AVX2)
    needs: resolve
    runs-on: macos-15-intel
    env:
      OUT_DIR: bin/darwin-x86_64/cpu
    steps:
      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp

      - name: Configure & build (CPU AVX2 x86_64)
        working-directory: llama.cpp
        run: |
          cmake -B build -S . \
            -DGGML_METAL=OFF -DGGML_ACCELERATE=OFF \
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_AVX=ON \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel

      - name: Collecte binaires + dylibs
        run: |
          mkdir -p "${OUT_DIR}"
          cp llama.cpp/build/bin/llama-server "${OUT_DIR}/"
          cp llama.cpp/build/bin/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true
          cp llama.cpp/build/ggml/src/*.dylib "${OUT_DIR}/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: llama-darwin-x86_64-cpu
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Compilation Linux — parallélisme borné à 2 : un --parallel non borné a
  # déjà provoqué des OOM (cc1plus tué) sur les runners standards.
  # ───────────────────────────────────────────────────────────────────────────
  build-linux-x64-cpu:
    name: Linux x86_64 CPU (AVX2, glibc 2.35)
    needs: resolve
    runs-on: ubuntu-22.04
    env:
      OUT_DIR: bin/linux-x86_64/cpu
    steps:
      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp

      - name: Configure & build (CPU AVX2)
        working-directory: llama.cpp
        run: |
          cmake -B build -S . \
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_AVX=ON \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel 2

      - name: Collecte binaires + libs
        run: |
          mkdir -p "${OUT_DIR}"
          cp llama.cpp/build/bin/llama-server "${OUT_DIR}/"
          cp -a llama.cpp/build/bin/*.so* "${OUT_DIR}/" 2>/dev/null || true
          cp -a llama.cpp/build/src/*.so* "${OUT_DIR}/" 2>/dev/null || true
          cp -a llama.cpp/build/ggml/src/*.so* "${OUT_DIR}/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: llama-linux-x86_64-cpu
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  build-linux-x64-cuda:
    name: Linux x86_64 CUDA
    needs: resolve
    runs-on: ubuntu-22.04
    env:
      OUT_DIR: bin/linux-x86_64/cuda
    steps:
      - name: Install CUDA Toolkit 12.4
        uses: Jimver/cuda-toolkit@v0.2.18
        with:
          cuda: "12.4.1"
          method: "network"

      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp

      - name: Configure & build (CUDA)
        working-directory: llama.cpp
        run: |
          cmake -B build -S . \
            -DGGML_CUDA=ON \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel 2

      - name: Collecte binaires + libs + runtime CUDA
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          cp llama.cpp/build/bin/llama-server "${OUT_DIR}/"
          cp -a llama.cpp/build/bin/*.so* "${OUT_DIR}/" 2>/dev/null || true
          cp -a llama.cpp/build/src/*.so* "${OUT_DIR}/" 2>/dev/null || true
          cp -a llama.cpp/build/ggml/src/*.so* "${OUT_DIR}/" 2>/dev/null || true
          # Runtime CUDA (noms SONAME, liens déréférencés) : chargé via le
          # LD_LIBRARY_PATH que positionne scripts/core-startup.sh.
          CUDA_LIB="${CUDA_PATH:-/usr/local/cuda}/lib64"
          for lib in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
              if [ ! -e "${CUDA_LIB}/${lib}" ]; then
                  echo "::error::Runtime CUDA introuvable : ${CUDA_LIB}/${lib}"
                  exit 1
              fi
              cp -L "${CUDA_LIB}/${lib}" "${OUT_DIR}/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: llama-linux-x86_64-cuda
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  build-linux-x64-vulkan:
    name: Linux x86_64 Vulkan
    needs: resolve
    runs-on: ubuntu-22.04
    env:
      OUT_DIR: bin/linux-x86_64/vulkan
    steps:
      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo add-apt-repository -y universe
          sudo apt-get update
          if ! apt-cache show glslc >/dev/null 2>&1; then
            echo "::error::Le dépôt Ubuntu contenant glslc est indisponible"
            apt-cache policy glslc || true
            exit 1
          fi
          sudo apt-get install -y libvulkan-dev vulkan-tools glslc
          glslc --version

      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp

      - name: Configure & build (Vulkan)
        working-directory: llama.cpp
        run: |
          cmake -B build -S . \
            -DGGML_VULKAN=ON \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel 2

      - name: Collecte binaires + libs
        run: |
          mkdir -p "${OUT_DIR}"
          cp llama.cpp/build/bin/llama-server "${OUT_DIR}/"
          cp -a llama.cpp/build/bin/*.so* "${OUT_DIR}/" 2>/dev/null || true
          cp -a llama.cpp/build/src/*.so* "${OUT_DIR}/" 2>/dev/null || true
          cp -a llama.cpp/build/ggml/src/*.so* "${OUT_DIR}/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: llama-linux-x86_64-vulkan
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  build-linux-aarch64-cpu:
    name: Linux ARM64 CPU (NEON, cross-compile)
    needs: resolve
    runs-on: ubuntu-22.04
    env:
      OUT_DIR: bin/linux-aarch64/cpu
    steps:
      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Checkout llama.cpp @${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          path: llama.cpp

      - name: Configure & build (aarch64 cross)
        working-directory: llama.cpp
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          cmake -B build -S . \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target llama-server --parallel 2

      - name: Collecte binaires + libs
        run: |
          mkdir -p "${OUT_DIR}"
          cp llama.cpp/build/bin/llama-server "${OUT_DIR}/"
          cp -a llama.cpp/build/bin/*.so* "${OUT_DIR}/" 2>/dev/null || true
          cp -a llama.cpp/build/src/*.so* "${OUT_DIR}/" 2>/dev/null || true
          cp -a llama.cpp/build/ggml/src/*.so* "${OUT_DIR}/" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: llama-linux-aarch64-cpu
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Job final : assemblage, contrôle de conformité, archives, release GitHub
  # ───────────────────────────────────────────────────────────────────────────
  package-release:
    name: Assemblage + release GitHub
    needs:
      - resolve
      - build-win-cpu
      - build-win-cuda
      - build-win-vulkan
      - python-windows
      - build-darwin-arm64-metal
      - build-darwin-arm64-cpu
      - build-darwin-x86_64-metal
      - build-darwin-x86_64-cpu
      - build-linux-x64-cpu
      - build-linux-x64-cuda
      - build-linux-x64-vulkan
      - build-linux-aarch64-cpu
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout du dépôt (tag/ref déclencheur)
        uses: actions/checkout@v4

      - name: Prépare l'arborescence portable AfricAIsoft-Portable-v${{ env.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          PKG="AfricAIsoft-Portable-v${VERSION}"
          # Échec immédiat si le dépôt ne contient pas ce que le validateur
          # du Key Builder exige (MasterCopyLayout.RequiredRootDirectories).
          missing=""
          for d in config mcp-servers ui scripts; do
              [ -d "${d}" ] || missing="${missing} ${d}/"
          done
          if [ -n "${missing}" ]; then
              echo "::error::Dossiers obligatoires absents du dépôt :${missing}"
              exit 1
          fi
          if [ ! -e start-windows.bat ] && [ ! -e start-linux.sh ] && [ ! -e start-mac.command ]; then
              echo "::error::Aucun launcher (start-windows.bat / start-linux.sh / start-mac.command)."
              exit 1
          fi
          mkdir -p "${PKG}"
          for item in \
              app config mcp-servers skills scripts ui tests docs \
              start-linux.sh start-mac.command start-windows.bat \
              stop-linux.sh stop-mac.sh \
              install.sh install.bat start.sh start.bat \
              README.md CHANGELOG.md LICENSE VERSION release.json release.json.sig
          do
              if [ -e "${item}" ]; then
                  cp -a "${item}" "${PKG}/"
              fi
          done
          mkdir -p "${PKG}/data/pids" "${PKG}/logs" "${PKG}/models"
          [ -f data/pids/.gitkeep ] && cp data/pids/.gitkeep "${PKG}/data/pids/" || :
          touch "${PKG}/logs/.gitkeep" "${PKG}/models/.gitkeep"
          # config/ : jamais settings.json (secrets utilisateur potentiels).
          rm -f "${PKG}/config/settings.json" "${PKG}/config/api_key.txt"
          if [ ! -f "${PKG}/config/settings.example.json" ]; then
              echo "::error::config/settings.example.json manquant dans le paquet."
              exit 1
          fi
          echo "PKG=${PKG}" >> "$GITHUB_ENV"

      - name: Télécharge tous les artifacts (binaires + Python Windows)
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Range les binaires aux bons chemins bin/<plat>/<backend>/
        shell: bash
        run: |
          set -euo pipefail
          declare -A MAP=(
            [llama-windows-cpu]="${PKG}/bin/windows/cpu"
            [llama-windows-cuda]="${PKG}/bin/windows/cuda"
            [llama-windows-vulkan]="${PKG}/bin/windows/vulkan"
            [llama-darwin-arm64-metal]="${PKG}/bin/darwin-arm64/metal"
            [llama-darwin-arm64-cpu]="${PKG}/bin/darwin-arm64/cpu"
            [llama-darwin-x86_64-metal]="${PKG}/bin/darwin-x86_64/metal"
            [llama-darwin-x86_64-cpu]="${PKG}/bin/darwin-x86_64/cpu"
            [llama-linux-x86_64-cpu]="${PKG}/bin/linux-x86_64/cpu"
            [llama-linux-x86_64-cuda]="${PKG}/bin/linux-x86_64/cuda"
            [llama-linux-x86_64-vulkan]="${PKG}/bin/linux-x86_64/vulkan"
            [llama-linux-aarch64-cpu]="${PKG}/bin/linux-aarch64/cpu"
          )
          for name in "${!MAP[@]}"; do
              src="artifacts/${name}"
              dst="${MAP[$name]}"
              # Pas de mkdir avant contrôle : un backend vide serait accepté
              # par erreur (EMPTY_BACKEND). Tous les jobs sont requis → erreur.
              if [ ! -d "${src}" ] || [ -z "$(ls -A "${src}")" ]; then
                  echo "::error::Artifact ${name} manquant ou vide"
                  exit 1
              fi
              mkdir -p "${dst}"
              cp -a "${src}/." "${dst}/"
          done
          find "${PKG}/bin/linux-x86_64" "${PKG}/bin/linux-aarch64" \
               "${PKG}/bin/darwin-arm64" "${PKG}/bin/darwin-x86_64" \
               -type f ! -name "*.so*" ! -name "*.dylib" -exec chmod +x {} +
          find "${PKG}" -maxdepth 2 -type f \( -name "*.sh" -o -name "*.command" \) -exec chmod +x {} +
          # Garde-fou : aucune dépendance OpenSSL dans les backends (hors python/).
          ssl_refs="$(find "${PKG}/bin" -path "*/python" -prune -o -type f -print0 \
                      | xargs -0 -r grep -a -l -E "libssl|libcrypto" 2>/dev/null || true)"
          if [ -n "${ssl_refs}" ]; then
            echo "::error::Binaires liés à OpenSSL (DLL/so/dylib absentes des postes clients) :"
            echo "${ssl_refs}"
            exit 1
          fi
          echo "✓ Aucune dépendance OpenSSL dans les backends llama-server"

      - name: Télécharge les runtimes Python embarqués
        shell: bash
        env:
          PBS_URL_BASE: "https://github.com/astral-sh/python-build-standalone/releases/download/${{ env.PBS_TAG }}"
          WIN_EMBED_URL: "https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/python-${{ env.PYTHON_VERSION }}-embed-amd64.zip"
        run: |
          set -euo pipefail
          mkdir -p /tmp/py
          # ── Windows embeddable (officiel python.org).
          curl -fSL "${WIN_EMBED_URL}" -o /tmp/py/win.zip
          mkdir -p "${PKG}/bin/windows/python"
          unzip -q /tmp/py/win.zip -d "${PKG}/bin/windows/python"
          # ── python-build-standalone (astral-sh), empreinte SHA-256 vérifiée.
          declare -A PBS=(
            [linux-x86_64]="cpython-${PYTHON_VERSION}+${PBS_TAG}-x86_64-unknown-linux-gnu-install_only.tar.gz"
            [linux-aarch64]="cpython-${PYTHON_VERSION}+${PBS_TAG}-aarch64-unknown-linux-gnu-install_only.tar.gz"
            [darwin-arm64]="cpython-${PYTHON_VERSION}+${PBS_TAG}-aarch64-apple-darwin-install_only.tar.gz"
            [darwin-x86_64]="cpython-${PYTHON_VERSION}+${PBS_TAG}-x86_64-apple-darwin-install_only.tar.gz"
          )
          for plat in "${!PBS[@]}"; do
              asset="${PBS[$plat]}"
              url="${PBS_URL_BASE}/${asset}"
              curl -fSL "${url}" -o "/tmp/py/${plat}.tar.gz"
              curl -fSL "${url}.sha256" -o "/tmp/py/${plat}.sha256" || {
                  echo "::error::Empreinte SHA-256 upstream indisponible pour ${asset}."
                  exit 1
              }
              expected="$(awk '{print $1}' "/tmp/py/${plat}.sha256")"
              actual="$(sha256sum "/tmp/py/${plat}.tar.gz" | awk '{print $1}')"
              if [ "${expected}" != "${actual}" ]; then
                  echo "::error::SHA-256 mismatch pour ${asset}. attendu=${expected} obtenu=${actual}"
                  exit 1
              fi
              mkdir -p "${PKG}/bin/${plat}/python"
              tar -C "${PKG}/bin/${plat}/python" --strip-components=1 -xzf "/tmp/py/${plat}.tar.gz"
          done

      - name: Setup Python 3.12 (résolution des wheels POSIX)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wheels Python POSIX + Python Windows pré-installé
        # POSIX : résolution croisée avec le python3 du runner (jamais les
        # interpréteurs embarqués étrangers : Exec format error). UN tag par
        # --platform : la forme fusionnée « a.b » n'est reconnue par pip comme
        # aucun tag (→ « from versions: none »).
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip

          download_wheels() {
              local plat="$1" pip_platform="$2"
              local wheels_dir="${PKG}/bin/${plat}/python/wheels"
              mkdir -p "${wheels_dir}"
              python3 -m pip download \
                --dest "${wheels_dir}" \
                --platform "${pip_platform}" \
                --python-version 3.12 \
                --implementation cp \
                --only-binary=:all: \
                --index-url https://pypi.org/simple \
                -r app/requirements.txt
          }
          download_wheels "linux-x86_64"  "manylinux_2_17_x86_64"
          download_wheels "linux-aarch64" "manylinux_2_17_aarch64"
          download_wheels "darwin-arm64"  "macosx_11_0_arm64"
          download_wheels "darwin-x86_64" "macosx_11_0_x86_64"

          # Windows : wheels + site-packages résolus nativement (job python-windows).
          PYWIN="artifacts/python-windows"
          for sub in wheels site-packages; do
              if [ -z "$(ls -A "${PYWIN}/${sub}" 2>/dev/null)" ]; then
                  echo "::error::${PYWIN}/${sub} manquant ou vide."
                  exit 1
              fi
          done
          WINPY="${PKG}/bin/windows/python"
          mkdir -p "${WINPY}/wheels" "${WINPY}/Lib/site-packages"
          cp -a "${PYWIN}/wheels/." "${WINPY}/wheels/"
          cp -a "${PYWIN}/site-packages/." "${WINPY}/Lib/site-packages/"

          # Active site-packages dans l'embeddable (._pth isole sys.path et
          # désactive `import site` par défaut). Fins de ligne CRLF conservées.
          python3 - "${WINPY}" <<'PY'
          import glob, os, sys
          pths = glob.glob(os.path.join(sys.argv[1], "python3*._pth"))
          if len(pths) != 1:
              sys.exit(f"::error::Fichier ._pth introuvable ou ambigu : {pths}")
          path = pths[0]
          lines = open(path, encoding="utf-8").read().splitlines()
          out = []
          for line in lines:
              out.append("import site" if line.strip().lstrip("#").strip() == "import site" else line)
          if "Lib\\site-packages" not in out:
              out.insert(out.index("import site") if "import site" in out else len(out), "Lib\\site-packages")
          if "import site" not in out:
              out.append("import site")
          with open(path, "w", encoding="utf-8", newline="\r\n") as fh:
              fh.write("\n".join(out) + "\n")
          print(f"{os.path.basename(path)} :", out)
          PY

      - name: Contrôle de conformité + construit les 4 archives (.zip)
        # Chaque archive est validée contre les règles du Key Builder
        # (MasterCopyValidator) AVANT compression ; tout écart fait échouer
        # le job au lieu de publier une master copy invalide.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          BASE="AfricAIsoft-Portable-v${VERSION}"

          check_layout() {
              local root="$1" label="$2" errs=0 nplat=0
              declare -A VALID=(
                [windows]="cpu cuda vulkan"
                [darwin-arm64]="cpu metal"
                [darwin-x86_64]="cpu metal"
                [linux-x86_64]="cpu cuda vulkan rocm"
                [linux-aarch64]="cpu"
              )
              for d in config mcp-servers bin ui scripts; do
                  [ -d "${root}/${d}" ] || { echo "::error::[${label}] Dossier obligatoire absent : ${d}/"; errs=$((errs+1)); }
              done
              if [ ! -e "${root}/start-windows.bat" ] && [ ! -e "${root}/start-linux.sh" ] && [ ! -e "${root}/start-mac.command" ]; then
                  echo "::error::[${label}] Aucun launcher à la racine."; errs=$((errs+1))
              fi
              for platdir in "${root}"/bin/*/; do
                  local plat; plat="$(basename "${platdir}")"
                  if [ -z "${VALID[$plat]+x}" ]; then
                      echo "::error::[${label}] Plateforme inconnue sous bin/ : ${plat}"; errs=$((errs+1)); continue
                  fi
                  nplat=$((nplat+1))
                  for bdir in "${platdir}"*/; do
                      local b; b="$(basename "${bdir}")"
                      [ "${b}" = "python" ] && continue
                      case " ${VALID[$plat]} " in
                          *" ${b} "*) ;;
                          *) echo "::error::[${label}] Backend invalide : ${plat}/${b}"; errs=$((errs+1)); continue ;;
                      esac
                      local srv=( "${bdir}"llama-server* )
                      [ ${#srv[@]} -gt 0 ] || { echo "::error::[${label}] llama-server absent : ${plat}/${b}"; errs=$((errs+1)); }
                  done
                  local whl=( "${platdir}"python/wheels/*.whl )
                  [ ${#whl[@]} -gt 0 ] || { echo "::error::[${label}] Aucune wheel : ${plat}/python/wheels/"; errs=$((errs+1)); }
              done
              [ ${nplat} -gt 0 ] || { echo "::error::[${label}] Aucune plateforme sous bin/."; errs=$((errs+1)); }
              [ ${errs} -eq 0 ] && echo "✓ [${label}] conforme (${nplat} plateforme(s))"
              return ${errs}
          }

          make_zip() {
              local name="$1"; shift
              local -a includes=("$@")
              local staging="staging-${name}"
              rm -rf "${staging}"
              mkdir -p "${staging}/${BASE}"
              cp -a "${PKG}"/*.md "${PKG}/LICENSE" "${PKG}/VERSION" "${staging}/${BASE}/" 2>/dev/null || true
              for item in app config mcp-servers skills scripts ui tests docs data logs models \
                          start-linux.sh start-mac.command start-windows.bat \
                          stop-linux.sh stop-mac.sh \
                          install.sh install.bat start.sh start.bat \
                          release.json release.json.sig; do
                  if [ -e "${PKG}/${item}" ]; then
                      cp -a "${PKG}/${item}" "${staging}/${BASE}/"
                  fi
              done
              mkdir -p "${staging}/${BASE}/bin"
              for inc in "${includes[@]}"; do
                  if [ ! -d "${PKG}/bin/${inc}" ]; then
                      echo "::error::[${name}] bin/${inc} absent du paquet."; return 1
                  fi
                  cp -a "${PKG}/bin/${inc}" "${staging}/${BASE}/bin/"
              done
              check_layout "${staging}/${BASE}" "${name}"
              # CHECKSUMS par archive (sous-ensemble de bin/) — format sha256sum,
              # chemins « ./… » acceptés par le validateur du Key Builder.
              ( cd "${staging}/${BASE}" && find . -type f ! -name "CHECKSUMS.sha256" -print0 \
                    | LC_ALL=C sort -z \
                    | xargs -0 sha256sum > CHECKSUMS.sha256 )
              ( cd "${staging}" && zip -qr "../dist/${BASE}-${name}.zip" "${BASE}" )
              rm -rf "${staging}"
              local sz
              sz=$(du -m "dist/${BASE}-${name}.zip" | awk '{print $1}')
              echo "→ ${BASE}-${name}.zip : ${sz} Mo"
              # Cibles indicatives : le runtime CUDA (cublasLt) les dépasse.
              if [ "${name}" = "all" ] && [ "${sz}" -gt 1200 ]; then
                  echo "::warning::${BASE}-${name}.zip = ${sz} Mo > 1200 Mo (cible)."
              elif [ "${name}" != "all" ] && [ "${sz}" -gt 500 ]; then
                  echo "::warning::${BASE}-${name}.zip = ${sz} Mo > 500 Mo (cible)."
              fi
          }

          make_zip "windows" windows
          make_zip "darwin"  darwin-arm64 darwin-x86_64
          make_zip "linux"   linux-x86_64 linux-aarch64
          make_zip "all"     windows darwin-arm64 darwin-x86_64 linux-x86_64 linux-aarch64
          ls -la dist/

      - name: Extrait la section CHANGELOG de la version en cours
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/release-notes.md
          import re, os
          v = os.environ["VERSION"]
          txt = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(
              rf"^##\s*\[{re.escape(v)}\][^\n]*\n(.*?)(?=^##\s*\[|\Z)",
              txt, flags=re.M | re.S)
          if m:
              print(m.group(0).rstrip())
          else:
              print(f"# AfricAIsoft Portable Studio v{v}\n\n"
                    "Section CHANGELOG.md correspondante introuvable ; "
                    "voir le fichier CHANGELOG.md dans l'archive.")
          PY
          head -20 /tmp/release-notes.md

      - name: Crée la release GitHub + upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AfricAIsoft Portable Studio v${{ env.VERSION }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/AfricAIsoft-Portable-v${{ env.VERSION }}-windows.zip
            dist/AfricAIsoft-Portable-v${{ env.VERSION }}-darwin.zip
            dist/AfricAIsoft-Portable-v${{ env.VERSION }}-linux.zip
            dist/AfricAIsoft-Portable-v${{ env.VERSION }}-all.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
