<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfricAIsoft Portable Studio</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%2280%22 font-size=%2280%22>A</text></svg>" />
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="logo">A</span>
        <div>
            <div class="brand-name">AfricAIsoft Portable Studio</div>
            <div class="brand-tag" data-i18n="tagline">Assistant IA local &amp; confidentiel</div>
        </div>
    </div>
    <div class="topbar-actions">
        <span id="health-badge" class="badge badge-unknown" title="État du stack">…</span>
        <select id="lang-select" aria-label="Language">
            <option value="fr">FR</option>
            <option value="en">EN</option>
        </select>
    </div>
</header>

<main class="layout">
    <aside class="sidebar">
        <section class="panel">
            <h2 data-i18n="platform.title">Plateforme</h2>
            <dl id="platform-info" class="kv"></dl>
        </section>

        <section class="panel">
            <h2 data-i18n="sysprompt.title">System prompt</h2>
            <div id="sp-locked-banner" class="banner hidden" data-i18n="sysprompt.locked">
                Verrouillé par l'administrateur
            </div>
            <textarea id="sp-textarea" rows="10" spellcheck="false"
                      placeholder="Chargement..."></textarea>
            <div class="sp-meta">
                <span id="sp-token-count">0</span>
                <span data-i18n="sysprompt.tokens">tokens (approx.)</span>
                &middot; <span id="sp-source">–</span>
            </div>
            <div class="sp-actions">
                <button id="sp-save" data-i18n="sysprompt.save">Enregistrer</button>
                <button id="sp-reset" class="secondary" data-i18n="sysprompt.reset">Défaut</button>
            </div>
        </section>
    </aside>

    <section class="chat">
        <div id="messages" class="messages"></div>

        <form id="chat-form" class="composer">
            <textarea id="user-input" rows="2"
                      data-i18n-placeholder="chat.placeholder"
                      placeholder="Écrivez votre message..."
                      required></textarea>
            <button id="send-btn" type="submit" data-i18n="chat.send">Envoyer</button>
        </form>
        <div class="chat-footer">
            <span id="model-name">–</span>
            &middot;
            <span id="stream-status" data-i18n="chat.idle">Prêt</span>
        </div>
    </section>
</main>

<script src="assets/app.js" defer></script>
</body>
</html>
